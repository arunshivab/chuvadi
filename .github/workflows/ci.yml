name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 15 }}
    # D-217 item 3: macOS has never run these tests. Until it has passed once it does not block a merge
    # (a macOS failure shows red in the job list, but the workflow result stays green).
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    env:
      # Outside tools the tests may require: Ghostscript on Ubuntu, WPF's XPS reader on Windows, none on macOS.
      CHUVADI_TEST_TOOLS: ${{ matrix.os == 'ubuntu-latest' && 'ghostscript' || matrix.os == 'windows-latest' && 'wpf' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install test tools (Ubuntu) - Ghostscript, run by tests only, never redistributed
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript
          gs --version

      - name: Build solution (warnings as errors)
        run: dotnet build -c Release

      - name: Enforce pure-BCL libraries (no PackageReference in shipped project files)
        shell: bash
        run: |
          # Only project files define dependencies — scanning everything would false-positive
          # on documentation that merely MENTIONS the tag (e.g. package READMEs).
          if grep -R --include="*.csproj" --include="*.props" --include="*.targets"                "<PackageReference" src/ shared/ ; then
            echo "::error::Shipped libraries must remain pure-BCL — PackageReference found in a project file under src/ or shared/."
            exit 1
          fi

      - name: Unit tests — Chuvadi.Sheets (xUnit)
        run: dotnet test tests/Chuvadi.Sheets.Tests -c Release --no-build --logger "trx;LogFileName=sheets.trx"

      - name: Unit tests — Chuvadi.Docs (xUnit)
        run: dotnet test tests/Chuvadi.Docs.Tests -c Release --no-build --logger "trx;LogFileName=docs.trx"

      - name: Unit tests — Chuvadi.Docs.Conversion (xUnit)
        run: dotnet test tests/Chuvadi.Docs.Conversion.Tests -c Release --no-build --logger "trx;LogFileName=docs-conversion.trx"

      - name: Unit tests — Chuvadi.Print (xUnit)
        run: dotnet test tests/Chuvadi.Print.Tests -c Release --no-build --logger "trx;LogFileName=print.trx"

      - name: Unit tests — Chuvadi.Print.Xps (xUnit, Windows only, WPF)
        if: matrix.os == 'windows-latest'
        run: dotnet test tests/Chuvadi.Print.Xps.Tests -c Release --no-build --logger "trx;LogFileName=print-xps.trx"

      - name: Unit tests — Chuvadi.Zip (xUnit)
        run: dotnet test tests/Chuvadi.Zip.Tests -c Release --no-build --logger "trx;LogFileName=zip.trx"

      - name: Unit tests — Chuvadi.Markup (xUnit)
        run: dotnet test tests/Chuvadi.Markup.Tests -c Release --no-build --logger "trx;LogFileName=markup.trx"

      - name: Unit tests — Chuvadi.Fonts (xUnit)
        run: dotnet test tests/Chuvadi.Fonts.Tests -c Release --no-build --logger "trx;LogFileName=fonts.trx"

      - name: Unit tests — Chuvadi.Fonts.Liberation (xUnit)
        run: dotnet test tests/Chuvadi.Fonts.Liberation.Tests -c Release --no-build --logger "trx;LogFileName=fonts-liberation.trx"

      - name: Unit tests — Chuvadi.Layout (xUnit)
        run: dotnet test tests/Chuvadi.Layout.Tests -c Release --no-build --logger "trx;LogFileName=layout.trx"

      - name: Unit tests — Chuvadi.Layout.Docs (xUnit)
        run: dotnet test tests/Chuvadi.Layout.Docs.Tests -c Release --no-build --logger "trx;LogFileName=layout-docs.trx"

      - name: Unit tests — Chuvadi.Layout.Sheets (xUnit)
        run: dotnet test tests/Chuvadi.Layout.Sheets.Tests -c Release --no-build --logger "trx;LogFileName=layout-sheets.trx"

      - name: Unit tests — Chuvadi.Layout.Documents (xUnit)
        run: dotnet test tests/Chuvadi.Layout.Documents.Tests -c Release --no-build --logger "trx;LogFileName=layout-documents.trx"

      - name: Unit tests — Chuvadi.Layout.Markup (xUnit)
        run: dotnet test tests/Chuvadi.Layout.Markup.Tests -c Release --no-build --logger "trx;LogFileName=layout-markup.trx"

      - name: Unit tests — Chuvadi.OpenType (xUnit)
        run: dotnet test tests/Chuvadi.OpenType.Tests -c Release --no-build --logger "trx;LogFileName=opentype.trx"

      - name: Unit tests — Chuvadi.Text.Shaping (xUnit)
        run: dotnet test tests/Chuvadi.Text.Shaping.Tests -c Release --no-build --logger "trx;LogFileName=text-shaping.trx"

      - name: Verification suite — Chuvadi.Sheets (end-to-end)
        run: dotnet run -c Release --no-build --project samples/Chuvadi.Sheets.ManualTests

      - name: Verification suite — Chuvadi.Docs (end-to-end)
        run: dotnet run -c Release --no-build --project samples/Chuvadi.Docs.ManualTests

      - name: Verification suite — Chuvadi.Docs.Conversion (end-to-end)
        run: dotnet run -c Release --no-build --project samples/Chuvadi.Docs.Conversion.ManualTests

      - name: Verification suite — Chuvadi.Print (end-to-end)
        run: dotnet run -c Release --no-build --project samples/Chuvadi.Print.ManualTests

      - name: Verification suite — Chuvadi.Zip (end-to-end)
        run: dotnet run -c Release --no-build --project samples/Chuvadi.Zip.ManualTests

      - name: Verification suite — Chuvadi.Markup (end-to-end)
        run: dotnet run -c Release --no-build --project samples/Chuvadi.Markup.ManualTests

      - name: Verification suite — Chuvadi.Fonts (end-to-end)
        run: dotnet run -c Release --no-build --project samples/Chuvadi.Fonts.ManualTests

      - name: Verification suite — Chuvadi.Layout (end-to-end)
        run: dotnet run -c Release --no-build --project samples/Chuvadi.Layout.ManualTests

      - name: Pack packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/Chuvadi.Sheets/Chuvadi.Sheets.csproj -c Release --no-build
          dotnet pack src/Chuvadi.Docs/Chuvadi.Docs.csproj -c Release --no-build
          dotnet pack src/Chuvadi.Docs.Conversion/Chuvadi.Docs.Conversion.csproj -c Release --no-build
          dotnet pack src/Chuvadi.Print/Chuvadi.Print.csproj -c Release --no-build
          dotnet pack src/Chuvadi.Print.Windows/Chuvadi.Print.Windows.csproj -c Release --no-build
          dotnet pack src/Chuvadi.Print.Ipp/Chuvadi.Print.Ipp.csproj -c Release --no-build
          dotnet pack src/Chuvadi.Print.Remote/Chuvadi.Print.Remote.csproj -c Release --no-build
          dotnet pack src/Chuvadi.Zip/Chuvadi.Zip.csproj -c Release --no-build
          dotnet pack src/Chuvadi.Markup/Chuvadi.Markup.csproj -c Release --no-build
          dotnet pack src/Chuvadi.Fonts/Chuvadi.Fonts.csproj -c Release --no-build
          dotnet pack src/Chuvadi.Fonts.Liberation/Chuvadi.Fonts.Liberation.csproj -c Release --no-build
          dotnet pack src/Chuvadi.Layout/Chuvadi.Layout.csproj -c Release --no-build
          dotnet pack src/Chuvadi.Layout.Docs/Chuvadi.Layout.Docs.csproj -c Release --no-build
          dotnet pack src/Chuvadi.Layout.Sheets/Chuvadi.Layout.Sheets.csproj -c Release --no-build
          dotnet pack src/Chuvadi.Layout.Documents/Chuvadi.Layout.Documents.csproj -c Release --no-build
          dotnet pack src/Chuvadi.Layout.Fonts/Chuvadi.Layout.Fonts.csproj -c Release --no-build
          dotnet pack src/Chuvadi.Layout.Markup/Chuvadi.Layout.Markup.csproj -c Release --no-build
          dotnet pack src/Chuvadi.OpenType/Chuvadi.OpenType.csproj -c Release --no-build
          dotnet pack src/Chuvadi.Text.Shaping/Chuvadi.Text.Shaping.csproj -c Release --no-build

      - name: Upload package artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: nupkgs
          path: |
            artifacts/bin/Chuvadi.Sheets/Release/*.nupkg
            artifacts/bin/Chuvadi.Docs/Release/*.nupkg
            artifacts/bin/Chuvadi.Docs.Conversion/Release/*.nupkg
            artifacts/bin/Chuvadi.Print/Release/*.nupkg
            artifacts/bin/Chuvadi.Print.Windows/Release/*.nupkg
            artifacts/bin/Chuvadi.Print.Ipp/Release/*.nupkg
            artifacts/bin/Chuvadi.Print.Remote/Release/*.nupkg
            artifacts/bin/Chuvadi.Zip/Release/*.nupkg
            artifacts/bin/Chuvadi.Markup/Release/*.nupkg
            artifacts/bin/Chuvadi.Fonts/Release/*.nupkg
            artifacts/bin/Chuvadi.Fonts.Liberation/Release/*.nupkg
            artifacts/bin/Chuvadi.Layout/Release/*.nupkg
            artifacts/bin/Chuvadi.Layout.Docs/Release/*.nupkg
            artifacts/bin/Chuvadi.Layout.Sheets/Release/*.nupkg
            artifacts/bin/Chuvadi.Layout.Documents/Release/*.nupkg
            artifacts/bin/Chuvadi.Layout.Fonts/Release/*.nupkg
            artifacts/bin/Chuvadi.Layout.Markup/Release/*.nupkg
            artifacts/bin/Chuvadi.OpenType/Release/*.nupkg
            artifacts/bin/Chuvadi.Text.Shaping/Release/*.nupkg

  # D-217 item 2: the shipped libraries must survive trimming and NativeAOT. tests/Chuvadi.TrimSmoke uses Chuvadi.Zip,
  # Chuvadi.Fonts and Chuvadi.Fonts.Liberation (add the other packages here as they get the same flags). Both publishes treat warnings as errors, and the
  # published executable is run: it exits non-zero on the first wrong result. The app is not in Chuvadi.slnx, never packed.
  trim-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install NativeAOT build tools (Ubuntu) - clang and zlib, used to link the test app only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Publish trimmed (TrimMode=full, warnings are errors)
        run: dotnet publish tests/Chuvadi.TrimSmoke -c Release -r linux-x64 -p:PublishTrimmed=true -p:TrimMode=full -p:TreatWarningsAsErrors=true -o artifacts/trim-smoke

      - name: Run the trimmed app
        run: ./artifacts/trim-smoke/Chuvadi.TrimSmoke

      - name: Publish NativeAOT (warnings are errors)
        run: dotnet publish tests/Chuvadi.TrimSmoke -c Release -r linux-x64 -p:PublishAot=true -p:TreatWarningsAsErrors=true -o artifacts/aot-smoke

      - name: Run the NativeAOT app
        run: ./artifacts/aot-smoke/Chuvadi.TrimSmoke

  # D-217 item 3: the shipped libraries must compile for the Android target framework. tests/Chuvadi.AndroidSmoke is a
  # net10.0-android class library that references Chuvadi.Zip, Chuvadi.Fonts and Chuvadi.Fonts.Liberation and calls their public API (add the other
  # packages as they are checked). Nothing is run on a device or emulator. Not in Chuvadi.slnx, never packed. Until it has
  # passed on the runner once it does not block a merge.
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install the Android workload (build tooling only, never shipped)
        run: dotnet workload install android

      - name: Build the Android smoke library (warnings are errors)
        run: dotnet build tests/Chuvadi.AndroidSmoke -c Release -p:TreatWarningsAsErrors=true
