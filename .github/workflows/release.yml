name: Release

# Per-package releases via tag prefix:
#   git tag -s sheets-v1.1.1 -m "Chuvadi.Sheets 1.1.1" && git push origin sheets-v1.1.1
#   git tag -s docs-v1.0.0   -m "Chuvadi.Docs 1.0.0"   && git push origin docs-v1.0.0
#   git tag -s print-v1.0.0  -m "Chuvadi.Print 1.0.0"  && git push origin print-v1.0.0
#   git tag -s zip-v1.0.0    -m "Chuvadi.Zip 1.0.0"    && git push origin zip-v1.0.0
#   git tag -s markup-v1.0.0 -m "Chuvadi.Markup 1.0.0" && git push origin markup-v1.0.0
#   git tag -s fonts-v1.0.0         -m "Chuvadi.Fonts 1.0.0"         && git push origin fonts-v1.0.0
#   git tag -s layout-v0.1.0        -m "Chuvadi.Layout 0.1.0"        && git push origin layout-v0.1.0
#   git tag -s layout-docs-v0.1.0   -m "Chuvadi.Layout.Docs 0.1.0"   && git push origin layout-docs-v0.1.0
#   git tag -s layout-sheets-v0.1.0 -m "Chuvadi.Layout.Sheets 0.1.0" && git push origin layout-sheets-v0.1.0
#   git tag -s layout-documents-v0.1.0 -m "Chuvadi.Layout.Documents 0.1.0" && git push origin layout-documents-v0.1.0
#   git tag -s layout-fonts-v0.1.0  -m "Chuvadi.Layout.Fonts 0.1.0"  && git push origin layout-fonts-v0.1.0
#   git tag -s fonts-liberation-v1.0.0 -m "Chuvadi.Fonts.Liberation 1.0.0" && git push origin fonts-liberation-v1.0.0
#   git tag -s layout-markup-v0.1.0 -m "Chuvadi.Layout.Markup 0.1.0" && git push origin layout-markup-v0.1.0
#   git tag -s opentype-v0.1.0      -m "Chuvadi.OpenType 0.1.0"      && git push origin opentype-v0.1.0
#   git tag -s text-shaping-v0.1.0  -m "Chuvadi.Text.Shaping 0.1.0"  && git push origin text-shaping-v0.1.0
#   git tag -s layout-pdf-v0.1.0    -m "Chuvadi.Layout.Pdf 0.1.0"    && git push origin layout-pdf-v0.1.0
#   git tag -s print-pdf-raster-v0.1.0 -m "Chuvadi.Print.Pdf.Raster 0.1.0" && git push origin print-pdf-raster-v0.1.0
# The prefix selects which package is built, tested, packed, and released.
# docs-v* releases TWO packages at one version: Chuvadi.Docs and Chuvadi.Docs.Conversion.
# layout-pdf-v* and print-pdf-raster-v* release the two staged projects (staging/). They need the Chuvadi.Pdf packages,
# which tools/chuvadi-pdf/fetch.sh downloads from the chuvadi-pdf GitHub release and checks against the hashes pinned
# in tools/chuvadi-pdf/hashes/ (D-236, D-241).
# Packages are attached to the GitHub release only; nothing is pushed to nuget.org for now.
# Signed tags (-s) are strongly recommended — see RELEASING.md.
on:
  push:
    tags: ["sheets-v*", "docs-v*", "print-v*", "zip-v*", "markup-v*", "fonts-v*", "fonts-liberation-v*", "layout-v*", "layout-docs-v*", "layout-sheets-v*", "layout-documents-v*", "layout-fonts-v*", "layout-markup-v*", "opentype-v*", "text-shaping-v*", "layout-pdf-v*", "print-pdf-raster-v*"]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve package from tag prefix
        id: pkg
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            sheets-v*) NAME="Chuvadi.Sheets" ;;
            docs-v*)   NAME="Chuvadi.Docs"; PACKAGES="Chuvadi.Docs Chuvadi.Docs.Conversion" ;;
            print-v*)  NAME="Chuvadi.Print"; PACKAGES="Chuvadi.Print Chuvadi.Print.Windows Chuvadi.Print.Ipp Chuvadi.Print.Remote" ;;
            zip-v*)    NAME="Chuvadi.Zip" ;;
            markup-v*) NAME="Chuvadi.Markup" ;;
            fonts-v*)  NAME="Chuvadi.Fonts" ;;
            fonts-liberation-v*) NAME="Chuvadi.Fonts.Liberation" ;;
            opentype-v*)     NAME="Chuvadi.OpenType" ;;
            text-shaping-v*) NAME="Chuvadi.Text.Shaping" ;;
            layout-pdf-v*)    NAME="Chuvadi.Layout.Pdf"; DIRBASE="staging/src"; STAGED=true; TESTS="staging/tests/Chuvadi.Layout.Pdf.Tests" ;;
            print-pdf-raster-v*) NAME="Chuvadi.Print.Pdf.Raster"; DIRBASE="staging"; STAGED=true; TESTS="staging/Chuvadi.Print.Pdf.Raster.Tests" ;;
            layout-documents-v*) NAME="Chuvadi.Layout.Documents" ;;
            layout-docs-v*)   NAME="Chuvadi.Layout.Docs" ;;
            layout-sheets-v*) NAME="Chuvadi.Layout.Sheets" ;;
            layout-fonts-v*)  NAME="Chuvadi.Layout.Fonts" ;;
            layout-markup-v*) NAME="Chuvadi.Layout.Markup" ;;
            layout-v*)        NAME="Chuvadi.Layout" ;;
            *) echo "::error::Unrecognized tag prefix: $TAG"; exit 1 ;;
          esac
          PACKAGES="${PACKAGES:-$NAME}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "dirbase=${DIRBASE:-src}" >> "$GITHUB_OUTPUT"
          echo "staged=${STAGED:-false}" >> "$GITHUB_OUTPUT"
          echo "tests=${TESTS:-}" >> "$GITHUB_OUTPUT"
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "Releasing $PACKAGES from tag $TAG"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # The whole solution is built and ALL suites run — a release of one package must
      # never ship from a commit where another is broken (shared internals).
      - name: Build + test everything
        run: |
          dotnet build -c Release
          dotnet test tests/Chuvadi.Sheets.Tests -c Release --no-build
          dotnet test tests/Chuvadi.Docs.Tests -c Release --no-build
          dotnet test tests/Chuvadi.Docs.Conversion.Tests -c Release --no-build
          dotnet test tests/Chuvadi.Print.Tests -c Release --no-build
          dotnet test tests/Chuvadi.Zip.Tests -c Release --no-build
          dotnet test tests/Chuvadi.Markup.Tests -c Release --no-build
          dotnet test tests/Chuvadi.Fonts.Tests -c Release --no-build
          dotnet test tests/Chuvadi.Fonts.Liberation.Tests -c Release --no-build
          dotnet test tests/Chuvadi.Layout.Tests -c Release --no-build
          dotnet test tests/Chuvadi.Layout.Docs.Tests -c Release --no-build
          dotnet test tests/Chuvadi.Layout.Sheets.Tests -c Release --no-build
          dotnet test tests/Chuvadi.Layout.Documents.Tests -c Release --no-build
          dotnet test tests/Chuvadi.Layout.Markup.Tests -c Release --no-build
          dotnet test tests/Chuvadi.OpenType.Tests -c Release --no-build
          dotnet test tests/Chuvadi.Text.Shaping.Tests -c Release --no-build
          dotnet run -c Release --no-build --project samples/Chuvadi.Sheets.ManualTests
          dotnet run -c Release --no-build --project samples/Chuvadi.Docs.ManualTests
          dotnet run -c Release --no-build --project samples/Chuvadi.Docs.Conversion.ManualTests
          dotnet run -c Release --no-build --project samples/Chuvadi.Print.ManualTests
          dotnet run -c Release --no-build --project samples/Chuvadi.Zip.ManualTests
          dotnet run -c Release --no-build --project samples/Chuvadi.Markup.ManualTests
          dotnet run -c Release --no-build --project samples/Chuvadi.Fonts.ManualTests
          dotnet run -c Release --no-build --project samples/Chuvadi.Layout.ManualTests

      # Staged projects (layout-pdf-v*, print-pdf-raster-v*) are not in the solution. They restore Chuvadi.Pdf from the
      # chuvadi-pdf release, downloaded and hash-checked by tools/chuvadi-pdf/fetch.sh, and are built and tested here.
      - name: Fetch the Chuvadi.Pdf packages (staged projects)
        id: pdf
        if: ${{ steps.pkg.outputs.staged == 'true' }}
        shell: bash
        run: |
          P="${{ steps.pkg.outputs.name }}"
          PDFV=$(dotnet msbuild "${{ steps.pkg.outputs.dirbase }}/$P/$P.csproj" -getProperty:ChuvadiPdfVersion -nologo | tr -d '[:space:]')
          if [ -z "$PDFV" ]; then echo "::error::ChuvadiPdfVersion is not set in $P"; exit 1; fi
          echo "$P is built against chuvadi-pdf $PDFV"
          bash tools/chuvadi-pdf/fetch.sh "$PDFV" "$RUNNER_TEMP/chuvadi-pdf-feed"
          echo "version=$PDFV" >> "$GITHUB_OUTPUT"
          echo "config=$RUNNER_TEMP/chuvadi-pdf-feed/nuget.ci.config" >> "$GITHUB_OUTPUT"

      - name: Build and test the staged project
        if: ${{ steps.pkg.outputs.staged == 'true' }}
        run: dotnet test "${{ steps.pkg.outputs.tests }}" -c Release -p:RestoreConfigFile="${{ steps.pdf.outputs.config }}"

      - name: Check the package versions match the tag (docs, print, fonts-liberation, opentype, text-shaping, staged)
        if: ${{ startsWith(github.ref_name, 'docs-v') || startsWith(github.ref_name, 'print-v') || startsWith(github.ref_name, 'fonts-liberation-v') || startsWith(github.ref_name, 'opentype-v') || startsWith(github.ref_name, 'text-shaping-v') || steps.pkg.outputs.staged == 'true' }}
        shell: bash
        run: |
          TAGV="${GITHUB_REF_NAME#*-v}"
          for p in ${{ steps.pkg.outputs.packages }}; do
            V=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "${{ steps.pkg.outputs.dirbase }}/$p/$p.csproj" | head -n 1)
            echo "$p version $V (tag version $TAGV)"
            if [ "$V" != "$TAGV" ]; then echo "::error::$p version $V does not match the tag version $TAGV"; exit 1; fi
          done

      - name: Pack ${{ steps.pkg.outputs.name }}
        shell: bash
        run: |
          mkdir -p dist
          for p in ${{ steps.pkg.outputs.packages }}; do
            dotnet pack "${{ steps.pkg.outputs.dirbase }}/$p/$p.csproj" -c Release --no-build
            cp artifacts/bin/$p/Release/*.nupkg dist/
          done
          ls -l dist

      # Author signing (optional): runs only when a code-signing certificate is configured.
      - name: Sign packages (if certificate configured)
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          HAS_CERT: ${{ secrets.SIGNING_CERT_PFX_BASE64 != '' }}
          PFX_B64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          PFX_PWD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          echo "$PFX_B64" | base64 -d > signing.pfx
          dotnet nuget sign dist/*.nupkg \
            --certificate-path signing.pfx \
            --certificate-password "$PFX_PWD" \
            --timestamper http://timestamp.digicert.com
          rm -f signing.pfx

      # Release notes: the CHANGELOG section of each released package (heading "## <version> ...").
      # Never the generated list of every PR since the previous tag, which mixes all libraries.
      - name: Release notes from the package CHANGELOG
        id: notes
        shell: bash
        run: |
          TAGV="${GITHUB_REF_NAME#*-v}"
          # A version with a hyphen (1.0.0-rc.1, 2.0.0-preview.1) is a pre-release, so GitHub does not mark it "Latest".
          # The test is on the VERSION only: every tag prefix (print-v, layout-docs-v ...) contains a hyphen.
          case "$TAGV" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          : > RELEASE_NOTES.md
          for p in ${{ steps.pkg.outputs.packages }}; do
            f="${{ steps.pkg.outputs.dirbase }}/$p/CHANGELOG.md"
            [ -f "$f" ] || continue
            sec=$(awk -v v="$TAGV" '/^## / { if (found) exit; split(substr($0, 4), a, " "); if (a[1] == v) { found = 1; next } } found { print }' "$f")
            if [ -n "$sec" ]; then printf '## %s %s\n\n%s\n\n' "$p" "$TAGV" "$sec" >> RELEASE_NOTES.md; fi
          done
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "${{ steps.pkg.outputs.packages }} $TAGV. See the package CHANGELOG.md for the changes." > RELEASE_NOTES.md
          fi
          if [ "${{ steps.pkg.outputs.staged }}" = "true" ]; then
            printf '\nBuilt and tested against the chuvadi-pdf %s packages (https://github.com/arunshivab/chuvadi-pdf/releases/tag/v%s), checked against the hashes pinned in tools/chuvadi-pdf/hashes/. The Chuvadi.Pdf packages are not part of this release: take them from that release.\n' "${{ steps.pdf.outputs.version }}" "${{ steps.pdf.outputs.version }}" >> RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Create GitHub release with the packages attached
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.nupkg
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          prerelease: ${{ steps.notes.outputs.prerelease }}

      # No nuget.org push for now (D-46): NUGET_API_KEY is not configured until the licence
      # is decided. To enable later, add a step here that pushes dist/*.nupkg, guarded by
      # `if: ${{ env.HAS_KEY == 'true' }}` with HAS_KEY: ${{ secrets.NUGET_API_KEY != '' }}.
